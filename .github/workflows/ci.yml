name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup is on every GitHub-hosted runner image, so there is no
      # third-party toolchain action to pin (design/dependencies.md).
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

  # The web UI: English and French with the same keys, every key the UI uses
  # defined, the logic of the appearance and i18n modules, and the Colony
  # tokens identical to the pinned Project-Colony-Resources commit. Node is
  # preinstalled on the runner, so no setup action is needed.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-i18n.mjs
      - run: node scripts/test-ui.mjs
      - run: scripts/sync-colony-tokens.sh --check

  # Builds on the declared floor, so rust-version in Cargo.toml is tested
  # rather than guessed. The floor is 1.90 because Tauri 2.12 and muda 0.20
  # require it. Keep the toolchain and the cache key below in sync with it.
  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.90 --profile minimal --no-self-update
          rustup default 1.90
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-1.90-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-1.90-
      - run: cargo build --release
      # The release workflow smoke-tests every artifact this way. A Windows
      # release build is a GUI-subsystem program, the case most likely to print
      # nothing, so check it on every change rather than at release time.
      - name: Smoke-test --version
        shell: bash
        run: ./target/release/exospine.exe --version | grep '^exospine [0-9]'
