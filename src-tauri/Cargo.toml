[package]
name = "exospine-tauri"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Portable email client built with Rust + Tauri v2"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Exospine"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.11.6", features = ["devtools"] }
tauri-plugin-shell = "2"

# Async runtime
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net", "fs", "io-util", "process"] }
futures = "0.3"

# Mail protocols
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
mail-parser = "0.9"

# HTML handling
html2text = "0.13"
ammonia = "4.2.1"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP client (for OAuth2 token exchange)
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }

# Security
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }
rustls = { version = "0.23.45", features = ["ring"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustls-native-certs = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Text cleanup
regex = "1"

# Security — zeroize secrets in memory
zeroize = "1"

# Encryption for accounts.json at rest
aes-gcm = "0.10"
sha2 = "0.10"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
notify-rust = "4"
