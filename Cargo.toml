[package]
name = "exospine"
version = "0.1.0"
edition = "2021"
description = "Portable Outlook-like email client built with Rust + Iced"
license = "MIT"
repository = "https://github.com/MotherSphere/Exospine-Private"

[dependencies]
# UI
iced = { version = "0.14", features = ["svg", "tokio"] }

# Async runtime
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net"] }
futures = "0.3"

# Mail protocols
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
mail-parser = "0.9"

# HTML handling
html2text = "0.13"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Security
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
