<!DOCTYPE html>
<html lang="en" data-colony-theme="gruvbox-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exospine</title>
  <link rel="stylesheet" href="vendor/colony/colony-themes.css">
  <link rel="stylesheet" href="styles/fonts.css">
  <script type="module" src="js/mail_window.js"></script>
  <!-- No <style> element here: Tauri would add a style nonce to the CSP, which
       turns off 'unsafe-inline' for the message's own inline styles. -->
</head>
<body style="margin:0;display:flex;flex-direction:column;height:100vh;font-family:var(--font);color:var(--colony-text-primary);background:var(--colony-bg-primary);">
  <header style="padding:16px 20px 12px;border-bottom:1px solid var(--colony-border-subtle);font-size:calc(var(--font-scale) * 13px);color:var(--colony-text-muted);">
    <div id="mail-subject" style="font-size:calc(var(--font-scale) * 20px);font-weight:bold;color:var(--colony-text-primary);margin-bottom:8px;"></div>
    <div id="mail-from"></div>
    <div id="mail-to"></div>
    <div id="mail-date"></div>
  </header>
  <iframe id="email-frame" sandbox="allow-same-origin" title="Email content" data-i18n-title="email_content" style="flex:1;width:100%;border:0;"></iframe>
</body>
</html>
